<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rubah Melompat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --peach:#e9cebb; --mist:#e3e5e6; --fox:#f0a060; --ember:#b06040; --bark:#4a2c20;
  --bg:#f6ece4; --ink:#4a2c20; --muted:#8a6455; --panel:#fffaf5; --line:#e6cfc0;
  --lift:0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#241812;--ink:#f6e4d6;--muted:#c4a08e;--panel:#33231b;--line:#523a2d}
}
:root[data-theme="dark"]{--bg:#241812;--ink:#f6e4d6;--muted:#c4a08e;--panel:#33231b;--line:#523a2d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 16px/1.55 "DM Sans",system-ui,sans-serif;
  display:grid;place-items:center;padding:24px 16px;
  background-image:radial-gradient(60% 50% at 30% calc(70% - var(--lift)*40%),rgba(240,160,96,calc(.10 + var(--lift)*.28)),transparent 70%)}
main{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr);gap:32px;align-items:center}
.stage-wrap{display:grid;grid-template-columns:1fr 14px;gap:12px;align-items:stretch}
.stage{position:relative;aspect-ratio:1;border-radius:28px;overflow:hidden;background:var(--mist);
  box-shadow:0 0 0 1px var(--line),0 24px 60px -24px rgba(176,96,64,calc(.25 + var(--lift)*.35));cursor:pointer;touch-action:manipulation}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas{display:none}
.stage.paused img{visibility:hidden}.stage.paused canvas{display:block}
.meter{border-radius:99px;background:var(--line);position:relative;overflow:hidden}
.meter i{position:absolute;left:0;right:0;bottom:0;height:calc(var(--lift)*100%);background:var(--fox);border-radius:99px}
h1{font:800 clamp(2.4rem,6vw,4rem)/.95 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:0 0 12px}
.state{font:500 1.15rem/1.3 "Bricolage Grotesque",sans-serif;color:var(--ember);min-height:1.5em;margin:0 0 20px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .state{color:var(--fox)}}
.panel{background:var(--panel);border-radius:22px;padding:18px;box-shadow:0 0 0 1px var(--line);margin-bottom:16px}
.bars{display:flex;align-items:flex-end;gap:4px;height:56px}
.bars b{flex:1;min-height:4px;height:4px;border-radius:3px;background:var(--fox);opacity:.55;transition:height .06s linear}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
button{font:500 1rem "DM Sans",sans-serif;border:0;border-radius:99px;padding:11px 20px;cursor:pointer;color:var(--ink);background:var(--line)}
button.main{background:var(--fox);color:#3a1f14}
button[aria-pressed="true"].main{background:var(--ember);color:#fff}
button:focus-visible,input:focus-visible,.stage:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.95rem;margin-left:auto}
input[type=range]{accent-color:var(--ember);width:110px}
svg{display:block;width:100%;height:84px;overflow:visible}
.cap{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:6px}
.hint{color:var(--muted);font-size:.9rem;margin:0}
@media (max-width:760px){main{grid-template-columns:1fr;gap:20px}.stage-wrap{max-width:460px;margin:0 auto;width:100%}}
</style>
</head>
<body>
<main>
  <div class="stage-wrap">
    <div class="stage" id="stage" role="button" tabindex="0" aria-label="Ketuk rubah untuk memutar suara">
      <img id="gif" alt="Rubah kecil berjalan lalu melompat">
      <canvas id="snap" width="220" height="220"></canvas>
    </div>
    <div class="meter" aria-hidden="true"><i></i></div>
  </div>
  <section>
    <h1>Rubah melompat</h1>
    <p class="state" id="state" aria-live="polite">Rubah sedang berjalan</p>
    <div class="panel">
      <div class="bars" id="bars" aria-hidden="true"></div>
      <div class="row">
        <button class="main" id="auto" aria-pressed="false">Aktifkan suara</button>
        <button id="once">Putar sekali</button>
        <label>Volume <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" aria-label="Volume"></label>
      </div>
    </div>
    <div class="panel">
      <svg id="curve" viewBox="0 0 560 84" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div class="cap"><span>0 dtk</span><span>tinggi lompatan sepanjang animasi</span><span>5,6 dtk</span></div>
      <div class="row"><button id="pause">Jeda</button><p class="hint">Ketuk rubah untuk mengulang dan memutar suara.</p></div>
    </div>
  </section>
</main>

const B=[138, 138, 136, 136, 135, 135, 135, 136, 136, 137, 137, 137, 137, 137, 137, 137, 137, 137, 143, 130, 129, 89, 74, 73, 79, 94, 144, 148, 149, 149, 149, 148, 148, 149, null, null, null, null, null, null, null, null, null, null, 138, 141, 141, 141, 144, 142, 144, 144, 141, 139, 137, 138], N=B.length, MS=100, LOOP=N*MS, JUMP=19;
const $=id=>document.getElementById(id), root=document.documentElement;
const phases=[[0,9,"Rubah sedang berjalan"],[9,19,"Rubah bersiap"],[19,27,"Melompat!"],[27,34,"Mendarat"],[34,44,"Rubah bersembunyi"],[44,N,"Rubah kembali"]];
const lift=B.map(b=>b==null?0:Math.max(0,Math.min(1,(137-b)/64)));
const b64=s=>{const d=s.split(",")[1],a=atob(d),u=new Uint8Array(a.length);for(let i=0;i<a.length;i++)u[i]=a.charCodeAt(i);return u};
const gifBlob=new Blob([b64(GIF)],{type:"image/gif"});
const img=$("gif"),stage=$("stage"),cv=$("snap");
let t0=performance.now(),paused=false,last=-1,auto=false,url;
function restart(){ if(url)URL.revokeObjectURL(url); url=URL.createObjectURL(gifBlob); img.src=url; t0=performance.now(); last=-1; }
img.addEventListener("load",()=>{ if(!paused) t0=performance.now(); });
restart();

// curve
const svg=$("curve"),pts=lift.map((v,i)=>[i/(N-1)*560,76-v*68]);
svg.innerHTML='<path d="M0 76 '+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+' L560 76Z" fill="#f0a060" opacity=".35"/>'+
 '<path d="M'+pts.map(p=>p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" L")+'" fill="none" stroke="#b06040" stroke-width="2.5" stroke-linejoin="round"/>'+
 '<line x1="'+(JUMP/(N-1)*560)+'" x2="'+(JUMP/(N-1)*560)+'" y1="0" y2="84" stroke="#b06040" stroke-dasharray="3 4" opacity=".6"/>'+
 '<line id="head" x1="0" x2="0" y1="0" y2="84" stroke="#f0a060" stroke-width="3" stroke-linecap="round"/>';
const head=$("head");

// audio
const bars=$("bars"); for(let i=0;i<24;i++)bars.appendChild(document.createElement("b"));
const bs=[...bars.children]; let ctx,buf,gain,an,data;
async function initAudio(){
  if(ctx){ if(ctx.state==="suspended")await ctx.resume(); return; }
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  gain=ctx.createGain(); gain.gain.value=+$("vol").value;
  an=ctx.createAnalyser(); an.fftSize=64; data=new Uint8Array(an.frequencyBinCount);
  gain.connect(an); an.connect(ctx.destination);
  buf=await ctx.decodeAudioData(b64(MP3).buffer);
}
async function play(){
  try{ await initAudio(); const s=ctx.createBufferSource(); s.buffer=buf; s.connect(gain); s.start(); }catch(e){ console.error(e); }
}
$("vol").addEventListener("input",e=>{ if(gain)gain.gain.value=+e.target.value; });
$("auto").addEventListener("click",async e=>{
  auto=!auto; e.target.setAttribute("aria-pressed",auto); e.target.textContent=auto?"Suara aktif":"Aktifkan suara";
  if(auto){ await initAudio(); }
});
$("once").addEventListener("click",play);
function poke(){ paused&&resume(); restart(); play(); }
stage.addEventListener("click",poke);
stage.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();poke();} });

// pause / resume
function resume(){ paused=false; stage.classList.remove("paused"); $("pause").textContent="Jeda"; restart(); }
$("pause").addEventListener("click",()=>{
  if(paused)return resume();
  cv.getContext("2d").drawImage(img,0,0,220,220); paused=true; stage.classList.add("paused"); $("pause").textContent="Lanjutkan";
});
if(matchMedia("(prefers-reduced-motion: reduce)").matches){ img.addEventListener("load",()=>{ if(!paused) setTimeout(()=>$("pause").click(),50); },{once:true}); }

// main loop: the interface follows the animation clock
function tick(now){
  if(!paused){
    const t=(now-t0)%LOOP, f=Math.floor(t/MS), fr=(t%MS)/MS;
    const v=lift[f]+(lift[(f+1)%N]-lift[f])*fr;
    root.style.setProperty("--lift",v.toFixed(3));
    head.setAttribute("x1",t/LOOP*560); head.setAttribute("x2",t/LOOP*560);
    if(f!==last){
      const p=phases.find(p=>f>=p[0]&&f<p[1]); $("state").textContent=p[2];
      if(auto&&f===JUMP&&last!==-1)play();
      last=f;
    }
  }
  if(an){ an.getByteFrequencyData(data); bs.forEach((b,i)=>{ b.style.height=(4+data[i%data.length]/255*52)+"px"; b.style.opacity=.5+data[i%data.length]/510; }); }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
